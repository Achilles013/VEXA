<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VEXA — Under Maintenance</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07111f;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      padding: 24px;
    }

    .maintenance {
      max-width: 680px;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 4px;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 42px;
      line-height: 1.15;
      margin-bottom: 18px;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
      color: #b8c2d1;
    }

    .line {
      width: 70px;
      height: 2px;
      background: #f59e0b;
      margin: 28px auto;
    }

    .copyright {
      margin-top: 50px;
      font-size: 13px;
      color: #718096;
    }
  </style>
</head>

<body>

  <main class="maintenance">
    <div class="logo">VEXA</div>

    <h1>VEXA is currently undergoing maintenance.</h1>

    <div class="line"></div>

    <p>
      We're making improvements and will be back shortly.
    </p>

    <div class="copyright">
      © 2026 VEXA. All rights reserved.
    </div>
  </main>

</body>
</html>
